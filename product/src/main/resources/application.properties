spring.application.name=Product
server.port=8082

spring.datasource.url=jdbc:h2:mem:evans
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true


spring.boot.admin.client.url=http://localhost:8081

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Resilience4j Circuit Breaker config
resilience4j.circuitbreaker.instances.testCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.testCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.testCB.waitDurationInOpenState=5s